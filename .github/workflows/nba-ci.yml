name: CourtCash NBA checks
on:
  pull_request:
    paths:
      - 'main.tsx'
      - 'nba.css'
      - 'api/nba.js'
      - 'api/nba-props.js'
      - 'lib/nba-pricing.mjs'
      - 'tests/nba-pricing.test.mjs'
      - 'package.json'
      - '.github/workflows/nba-ci.yml'
  push:
    branches: ['feature/courtcash-nba']
jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
